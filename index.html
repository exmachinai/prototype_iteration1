<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VerifyWise Audit Wiki · Sofort-Start</title>
<meta http-equiv="refresh" content="0; url=../02_Wiki/index.html">
<style>
  :root{
    --primary:#1E2761; --primary-dark:#0B143E; --accent:#E6B32F;
    --body:#4D556B; --rule:#D6DAE6; --bg:#F7F8FB; --surface:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--body);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .launcher{
    background:var(--surface); border:1px solid var(--rule);
    border-radius:12px; padding:40px 48px; max-width:560px;
    box-shadow:0 4px 20px rgba(30,39,97,.08);
    text-align:center;
  }
  h1{
    color:var(--primary); font-size:22px; font-weight:600;
    margin-bottom:8px; letter-spacing:.2px;
  }
  .subtitle{
    font-size:13px; color:var(--body); opacity:.75;
    margin-bottom:24px;
  }
  .pill-row{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    margin-bottom:28px;
  }
  .pill{
    background:var(--accent); color:var(--primary-dark);
    padding:4px 12px; border-radius:14px;
    font-size:11px; font-weight:600; letter-spacing:.5px;
    text-transform:uppercase;
  }
  .pill.muted{ background:#f1f2f8; color:var(--primary); }
  .cta{
    display:inline-block; background:var(--primary); color:#fff;
    padding:12px 32px; border-radius:8px;
    text-decoration:none; font-weight:600; font-size:14px;
    transition:all .15s;
  }
  .cta:hover{ background:var(--primary-dark); transform:translateY(-1px); }
  .hint{
    font-size:11px; color:var(--body); opacity:.6;
    margin-top:18px; line-height:1.5;
  }
  .loader{
    margin: 18px auto 0; width: 28px; height: 28px;
    border: 2px solid var(--rule); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="launcher">
    <h1>VerifyWise Audit Wiki</h1>
    <div class="subtitle">Konsolidiertes Single-File Briefing</div>
    <div class="pill-row">
      <span class="pill">v04-consolidated</span>
      <span class="pill muted">TABLETOP-3-GO</span>
      <span class="pill muted">2026-04-26</span>
    </div>
    <a class="cta" href="../02_Wiki/index.html">Wiki jetzt öffnen &rarr;</a>
    <div class="loader"></div>
    <div class="hint">
      Du wirst automatisch weitergeleitet. Falls nicht, klick oben auf <strong>"Wiki jetzt öffnen"</strong>.<br>
      Pfad: <code>../02_Wiki/index.html</code>
    </div>
  </div>
</body>
</html>
