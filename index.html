/* ═══════════════════════════════════════════ */
/* AEGIRA Design System                        */
/* ═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --navy:#172238;--steel:#50617D;--slate:#6B7B8D;
  --accent:#2A6496;--green:#3D8B6E;--amber:#E6A817;--red:#C62828;--orange:#E65100;
  --surface1:#172238;--surface2:#0E1A2B;--surface3:#1A2D44;
  --text1:#FFFFFF;--text2:#E8EDF2;--text3:#6B7B8D;
  --font:'Segoe UI',Calibri,sans-serif;
  --mono:'Cascadia Code','Fira Code',monospace;
  --sidebar-w:240px;--topbar-h:52px;
  --radius:8px;--radius-sm:4px;
  --transition:all .3s ease;
}
[data-theme="light"] {
  --surface1:#F5F7FA;--surface2:#FFFFFF;--surface3:#E8EDF2;
  --text1:#172238;--text2:#50617D;--text3:#6B7B8D;
}
html,body{height:100%;font-family:var(--font);background:var(--surface1);color:var(--text1);transition:var(--transition)}
body{overflow:hidden}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);border:none;outline:none}
input{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--steel);border-radius:3px}

/* Login */
.login-bg{position:fixed;inset:0;background:#172238;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-card{background:#0E1A2B;border-radius:12px;padding:48px 40px;width:440px;max-width:90vw;text-align:center;
  animation:slideUp .5s ease-out;box-shadow:0 24px 64px rgba(0,0,0,.4);color:#FFFFFF}
.login-card h1,.login-card p{color:#E8EDF2}
.login-card p{opacity:.7}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-card img.splash{height:200px;margin-bottom:24px;animation:logoFade .6s ease;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;display:inline-block}
@keyframes logoFade{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.login-card h1{font-size:20px;color:#FFFFFF;margin-bottom:8px;font-weight:600}
.login-card p{font-size:13px;color:#6B7B8D;margin-bottom:28px}
.sso-btn{width:100%;padding:14px;background:#2A6496;color:#fff;font-size:14px;font-weight:600;border-radius:8px;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s ease;text-align:center}
.sso-btn:hover{background:#1E4F7A;transform:translateY(-1px)}
.mfa-grid{display:flex;gap:8px;justify-content:center;margin:24px 0}
.mfa-input{width:44px;height:52px;background:#1A2D44;border:2px solid #50617D;border-radius:var(--radius);
  color:#FFFFFF;font-size:22px;text-align:center;font-weight:700;transition:var(--transition)}
.mfa-input.filled{border-color:var(--accent);background:#0E1A2B}
.persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.persona-card{background:#1A2D44;border-radius:var(--radius);padding:20px 16px;cursor:pointer;transition:var(--transition);
  border:2px solid transparent;text-align:left}
.persona-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.persona-card .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-bottom:8px;font-weight:700}
.persona-card h3{font-size:13px;color:#FFFFFF;margin-bottom:2px}
.persona-card span{font-size:11px;color:#6B7B8D}

/* Layout */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--surface2);border-right:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;transition:var(--transition);overflow-y:auto;flex-shrink:0;z-index:50}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:24px 16px;display:flex;align-items:flex-start;justify-content:flex-start;border-bottom:1px solid rgba(255,255,255,.06);background:#172238;border-radius:8px 8px 0 0}
.sidebar-logo img{height:160px;width:auto;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
.sidebar.collapsed .sidebar-logo img{height:40px}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-section{display:none}
.nav-section{padding:8px 16px 4px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:var(--transition);
  border-left:3px solid transparent;color:var(--text3);font-size:13px;white-space:nowrap}
.nav-item:hover{background:var(--surface3);color:var(--text2)}
.nav-item.active{border-left-color:var(--accent);color:var(--accent);background:rgba(42,100,150,.1)}
.nav-icon{width:20px;text-align:center;flex-shrink:0;font-size:16px}

.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--surface2);border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
.topbar-breadcrumb{font-size:13px;color:var(--text3)}
.topbar-spacer{flex:1}
.topbar-btn{width:36px;height:36px;border-radius:var(--radius);background:transparent;color:var(--text3);
  display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition);position:relative}
.topbar-btn:hover{background:var(--surface3);color:var(--text1)}
.topbar-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;background:var(--red);color:#fff;
  font-size:9px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.persona-badge{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface3);border-radius:20px;
  font-size:12px;color:var(--text2);cursor:pointer}
.persona-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}

.content{flex:1;overflow-y:auto;padding:24px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--surface2);border-radius:var(--radius);padding:20px;transition:var(--transition);
  border:1px solid rgba(255,255,255,.04)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.15)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:var(--text1)}
.card-subtitle{font-size:11px;color:var(--text3)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-red{background:rgba(198,40,40,.15);color:#EF5350}
.badge-orange{background:rgba(230,81,0,.15);color:#FF8A65}
.badge-amber{background:rgba(230,168,23,.15);color:#FFD54F}
.badge-green{background:rgba(61,139,110,.15);color:#66BB6A}
.badge-blue{background:rgba(42,100,150,.15);color:#64B5F6}
.badge-steel{background:rgba(80,97,125,.15);color:var(--steel)}

/* Dashboard Grid */
.dash-grid{display:grid;gap:20px}
.dash-grid-2{grid-template-columns:1fr 1fr}
.dash-grid-3{grid-template-columns:1fr 1fr 1fr}
.dash-grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.dash-grid-60-40{grid-template-columns:3fr 2fr}

/* GMS Gauge */
.gauge-container{position:relative;width:200px;height:200px;margin:0 auto}
.gauge-svg{width:100%;height:100%}
.gauge-value{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:700;color:var(--accent)}
.gauge-label{text-align:center;font-size:12px;color:var(--text3);margin-top:-8px}

/* Radar */
.radar-container{position:relative;width:280px;height:280px;margin:0 auto}

/* Table */
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.data-table td{padding:10px 12px;font-size:13px;color:var(--text2);border-bottom:1px solid rgba(255,255,255,.04)}
.data-table tr:hover td{background:var(--surface3)}

/* Wizard */
.wizard-steps{display:flex;align-items:center;gap:4px;margin-bottom:24px}
.wizard-step{flex:1;text-align:center;padding:8px 4px;border-radius:var(--radius-sm);font-size:11px;color:var(--text3);
  background:var(--surface3);transition:var(--transition);cursor:pointer}
.wizard-step.active{background:var(--accent);color:#fff;font-weight:600}
.wizard-step.done{background:var(--green);color:#fff}
.wizard-step-arrow{color:var(--steel);font-size:14px;flex-shrink:0}

/* CoPilot Panel */
.copilot-overlay{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--surface2);
  border-left:1px solid rgba(255,255,255,.08);z-index:200;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s ease;box-shadow:-8px 0 32px rgba(0,0,0,.3)}
.copilot-overlay.open{transform:translateX(0)}
.copilot-header{padding:16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.copilot-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.copilot-bubble{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;animation:bubbleIn .3s ease}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.copilot-bubble.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.copilot-bubble.bot{background:var(--surface3);color:var(--text2);align-self:flex-start;border-bottom-left-radius:4px}
.copilot-bubble .typing-cursor{display:inline-block;width:2px;height:14px;background:var(--accent);margin-left:2px;
  animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}
.copilot-input{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:8px}
.copilot-input input{flex:1;background:var(--surface3);border:1px solid var(--steel);border-radius:var(--radius);padding:10px 14px;
  color:var(--text1);font-size:13px}
.copilot-input button{background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px 16px;font-weight:600;font-size:13px}
.copilot-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.copilot-chip{padding:6px 12px;background:var(--surface3);border:1px solid var(--steel);border-radius:16px;
  font-size:11px;color:var(--text2);cursor:pointer;transition:var(--transition)}
.copilot-chip:hover{border-color:var(--accent);color:var(--accent)}

/* Toast */
.toast-container{position:fixed;top:60px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{padding:14px 20px;border-radius:var(--radius);background:var(--surface2);border-left:4px solid var(--accent);
  box-shadow:0 8px 32px rgba(0,0,0,.3);animation:toastIn .4s ease-out;max-width:380px;
  display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text2)}
.toast.warning{border-left-color:var(--amber)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--accent)}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-close{cursor:pointer;color:var(--text3);font-size:16px;margin-left:auto;flex-shrink:0}

/* Tour Overlay */
.tour-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800}
.tour-tooltip{position:fixed;background:var(--surface2);border-radius:var(--radius);padding:20px;max-width:320px;z-index:801;
  box-shadow:0 16px 48px rgba(0,0,0,.4);border:1px solid var(--accent);animation:fadeIn .3s ease}
.tour-tooltip h4{font-size:14px;color:var(--text1);margin-bottom:8px}
.tour-tooltip p{font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:16px}
.tour-actions{display:flex;justify-content:space-between;align-items:center}
.tour-btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:600}
.tour-btn-skip{background:transparent;color:var(--text3)}
.tour-btn-next{background:var(--accent);color:#fff}
.tour-dots{display:flex;gap:4px}
.tour-dot{width:6px;height:6px;border-radius:50%;background:var(--steel)}
.tour-dot.active{background:var(--accent)}

/* Sankey */
.sankey-container{width:100%;min-height:400px;position:relative}
.sankey-container svg{width:100%;height:400px}
.sankey-node rect{cursor:pointer;transition:opacity .2s}
.sankey-node rect:hover{opacity:.8}
.sankey-link{fill:none;stroke-opacity:.3}
.sankey-link:hover{stroke-opacity:.6}

/* Evidence Graph */
.graph-container{display:flex;gap:0;height:500px;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.graph-svg{flex:1;background:var(--surface2)}
.graph-detail{width:300px;background:var(--surface3);padding:20px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.06)}
.graph-node{cursor:pointer}
.graph-node circle{transition:r .2s ease}

/* Export Buttons */
.export-btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;
  background:var(--surface3);color:var(--text2);display:inline-flex;align-items:center;gap:6px;transition:var(--transition)}
.export-btn:hover{background:var(--accent);color:#fff}

/* Posthoc Hint */
.posthoc-hint{background:rgba(42,100,150,.1);border:1px solid rgba(42,100,150,.3);border-radius:var(--radius-sm);
  padding:8px 14px;font-size:11px;color:var(--accent);display:flex;align-items:center;gap:8px;margin-top:12px}

/* Responsive */
@media(max-width:1023px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .dash-grid-2,.dash-grid-60-40{grid-template-columns:1fr}
  .copilot-overlay{width:100%}
}
@media(max-width:767px){
  .content{padding:16px}
  .persona-grid{grid-template-columns:1fr}
  .dash-grid-3,.dash-grid-4{grid-template-columns:1fr 1fr}
  .topbar{padding:0 12px}
}

/* Scrollbar for light mode */
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#C4C4C4}

@media (max-width: 768px) {
  .sidebar{position:fixed;left:-240px;z-index:100;height:100vh;transition:var(--transition)}
  .sidebar.mobile-open{left:0}
  .dash-grid-2,.dash-grid-3,.dash-grid-4,.dash-grid-60-40{grid-template-columns:1fr}
  .content{padding:16px}
  .topbar{padding:0 12px}
  #menu-btn{display:flex!important}
  .copilot-overlay{width:100%}
  .graph-container{flex-direction:column}
  .graph-svg{height:300px}
  .graph-detail{width:100%;height:auto}
}

@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{background:linear-gradient(90deg,var(--surface3) 25%,var(--surface2) 50%,var(--surface3) 75%);background-size:400px 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius);height:20px;margin-bottom:8px}

/* DIDACTIC INFO BANNERS & TOOLTIPS */
.info-banner{background:linear-gradient(135deg,rgba(42,100,150,.12),rgba(42,100,150,.06));border:1px solid rgba(42,100,150,.2);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--text2);line-height:1.6}
.info-banner .banner-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.info-banner .banner-close{cursor:pointer;margin-left:auto;font-size:14px;color:var(--text3);flex-shrink:0}
.info-tip{position:relative;display:inline-flex;align-items:center;cursor:help}
.info-tip .tip-icon{width:16px;height:16px;border-radius:50%;background:rgba(42,100,150,.15);color:var(--accent);font-size:10px;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;font-weight:700}
.info-tip .tip-text{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--text2);width:240px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);line-height:1.5;pointer-events:none}
.info-tip:hover .tip-text{display:block}
@keyframes flowDash{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.graph-link-animated{animation:flowDash 1.5s linear infinite}
.usecase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.usecase-card{background:var(--surface3);border-radius:var(--radius);padding:14px;cursor:pointer;transition:var(--transition);border:1px solid transparent}
.usecase-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.usecase-card h4{font-size:12px;color:var(--text1);margin-bottom:4px}
.usecase-card p{font-size:11px;color:var(--text3);line-height:1.4}
.kanban-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kanban-col{background:var(--surface3);border-radius:var(--radius);padding:12px;min-height:200px}
.kanban-col-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid}
.kanban-card{background:var(--surface2);border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px;border-left:3px solid}
.kanban-card .k-title{color:var(--text1);font-weight:600;margin-bottom:4px}
.kanban-card .k-meta{color:var(--text3);font-size:10px}
.view-toggle{display:inline-flex;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.view-toggle button{padding:6px 14px;font-size:11px;font-weight:600;background:transparent;color:var(--text3);border:none;cursor:pointer;transition:var(--transition)}
.view-toggle button.active{background:var(--accent);color:#fff}
.timeline-item{position:relative;padding-left:32px;padding-bottom:16px;border-left:2px solid rgba(255,255,255,.08);margin-left:8px}
.timeline-item:last-child{border-left-color:transparent}
.timeline-dot{position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface1)}
.timeline-date{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600}
.timeline-content{background:var(--surface3);border-radius:var(--radius);padding:12px}
.timeline-content h4{font-size:13px;color:var(--text1);margin-bottom:2px}
.timeline-content p{font-size:11px;color:var(--text3);margin:0}
.timeline-filter{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.timeline-filter button{padding:4px 10px;font-size:10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text3);cursor:pointer;transition:var(--transition)}
.timeline-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

/* ANIMATED NUMBER                             */
/* ═══════════════════════════════════════════ */
function AnimatedNumber({value, duration=1500, prefix="", suffix=""}) {
  const [display, setDisplay] = useState(0);
  const ref = useRef();
  useEffect(() => {
    let start = 0; const startTime = Date.now();
    const animate = () => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(Math.round(eased * value));
      if (progress < 1) ref.current = requestAnimationFrame(animate);
    };
    ref.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(ref.current);
  }, [value, duration]);
  return <span>{prefix}{display}{suffix}</span>;
}

/* ═══════════════════════════════════════════ */
/* GMS GAUGE (SVG)                             */
/* ═══════════════════════════════════════════ */
function GmsGauge({value=72, size=200}) {
  const [animVal, setAnimVal] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setAnimVal(value), 100);
    return () => clearTimeout(t);
  }, [value]);
  const cx=size/2, cy=size/2, r=size*0.38;
  const startAngle = -225, endAngle = 45, range = endAngle - startAngle;
  const valAngle = startAngle + (animVal/100)*range;
  const toRad = (d) => d*Math.PI/180;
  const arcPath = (start, end) => {
    const s = toRad(start), e = toRad(end);
    const x1=cx+r*Math.cos(s), y1=cy+r*Math.sin(s);
    const x2=cx+r*Math.cos(e), y2=cy+r*Math.sin(e);
    const large = (end-start) > 180 ? 1 : 0;
    return `M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}`;
  };
  const color = animVal >= 80 ? "#3D8B6E" : animVal >= 60 ? "#2A6496" : animVal >= 40 ? "#E6A817" : "#C62828";
  return (
    <div className="gauge-container" style={{width:size,height:size}}>
      <svg className="gauge-svg" viewBox={`0 0 ${size} ${size}`}>
        <path d={arcPath(startAngle, endAngle)} fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="12" strokeLinecap="round"/>
        <path d={arcPath(startAngle, valAngle)} fill="none" stroke={color} strokeWidth="12" strokeLinecap="round"
          style={{transition:"all 2s cubic-bezier(.4,0,.2,1)"}}/>
      </svg>
      <div className="gauge-value" style={{color}}>
        <AnimatedNumber value={value} duration={2000}/>
      </div>
      <div className="gauge-label">Governance Maturity Score</div>
    </div>
  );
}

  const cx=size/2, cy=size/2, r=size*0.38;
  const n = data.length;
  const points = data.map((d, i) => {
    const angle = (i/n)*2*Math.PI - Math.PI/2;
    const val = show ? d.value/100 : 0;
    return {x: cx + r*val*Math.cos(angle), y: cy + r*val*Math.sin(angle), label: d.name, value: d.value};
  });
  const gridLevels = [0.25, 0.5, 0.75, 1.0];
  return (
    <div className="radar-container" style={{width:size,height:size}}>
      <svg viewBox={`0 0 ${size} ${size}`} style={{width:"100%",height:"100%"}}>
        {gridLevels.map((lv, li) => (
          <polygon key={li} points={data.map((_, i) => {
            const a=(i/n)*2*Math.PI-Math.PI/2;
            return `${cx+r*lv*Math.cos(a)},${cy+r*lv*Math.sin(a)}`;
          }).join(" ")} fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="1"/>
        ))}
        {data.map((_, i) => {
          const a=(i/n)*2*Math.PI-Math.PI/2;
          return <line key={i} x1={cx} y1={cy} x2={cx+r*Math.cos(a)} y2={cy+r*Math.sin(a)} stroke="rgba(255,255,255,.06)" strokeWidth="1"/>;
        })}
        <polygon points={points.map(p=>`${p.x},${p.y}`).join(" ")} fill="rgba(42,100,150,.25)" stroke="#2A6496" strokeWidth="2"
          style={{transition:"all 1.2s cubic-bezier(.4,0,.2,1)"}}/>
        {points.map((p, i) => (
          <g key={i}>
            <circle cx={p.x} cy={p.y} r="4" fill="#2A6496" style={{transition:"all 1.2s ease"}}/>
            <text x={cx + (r+18)*Math.cos((i/n)*2*Math.PI-Math.PI/2)} y={cy + (r+18)*Math.sin((i/n)*2*Math.PI-Math.PI/2)}
              fill="var(--text3)" fontSize="10" textAnchor="middle" dominantBaseline="middle">{p.label.split(" ")[0]}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

/* ═══════════════════════════════════════════ */
/* LINE CHART (SVG)                            */
/* ═══════════════════════════════════════════ */
function LineChart({data, width=400, height=180}) {
  const pad = {t:20,r:20,b:30,l:36};
  const w = width-pad.l-pad.r, h = height-pad.t-pad.b;
  const maxV = Math.max(...data.map(d=>d.score));
  const minV = Math.min(...data.map(d=>d.score));
  const range = maxV - minV || 1;
  const pts = data.map((d,i) => ({
    x: pad.l + (i/(data.length-1))*w,
    y: pad.t + h - ((d.score-minV)/range)*h*0.8 - h*0.1
  }));
  const line = pts.map((p,i) => `${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:"100%",height}}>
      {data.map((d,i) => (
        <text key={i} x={pts[i].x} y={height-8} fill="var(--text3)" fontSize="9" textAnchor="middle">{d.month}</text>
      ))}
      <path d={line} fill="none" stroke="#2A6496" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4" fill="#2A6496" stroke="var(--surface2)" strokeWidth="2"/>
          <text x={p.x} y={p.y-10} fill="var(--text2)" fontSize="10" textAnchor="middle" fontWeight="600">{data[i].score}</text>
        </g>
      ))}
    </svg>
  );
}

/* ═══════════════════════════════════════════ */
/* BAR (horizontal)                            */
/* ═══════════════════════════════════════════ */
function HBar({value, max=100, color="#2A6496", height=8}) {
  const [w, setW] = useState(0);
  useEffect(() => { setTimeout(() => setW(value/max*100), 100); }, [value,max]);
  return (
    <div style={{background:"rgba(255,255,255,.06)",borderRadius:height/2,height,width:"100%",overflow:"hidden"}}>
      <div style={{width:`${w}%`,height:"100%",background:color,borderRadius:height/2,transition:"width 1.5s cubic-bezier(.4,0,.2,1)"}}/>
    </div>
  );
}

/* COPILOT PANEL                               */

function CoPilotPanel() {
  const {state, set} = useApp();
  const [typing, setTyping] = useState(false);
  const [typedText, setTypedText] = useState("");
  const [inputVal, setInputVal] = useState("");
  const msgEndRef = useRef();

  const suggestions = useMemo(() => {
    if (!state.persona) return [];
    const screenSuggestions = {
      dashboard: {
        executive: ["Warum ist der GMS gefallen?","Welche Modelle haben das höchste Risiko?","Zeige Quartalsvergleich"],
        compliance: ["Wie viele Modelle sind noch offen?","Welche Deadline ist am kritischsten?","Compliance-Fortschritt zeigen"],
        technical: ["Welche Policies blockieren Deployments?","Gate-Pass-Rate erklären","Letzte Policy-Violations"],
        auditor: ["Evidence-Lücken identifizieren","Completeness-Score erklären","Prüfungsrelevante Modelle zeigen"]
      },
      checker: {default: ["Ist KreditScore-LLM Hochrisiko?","Welche Art. 9 Pflichten fehlen?","Vergleiche mit ISO 42001"]},
      evidence: {default: ["Welche Evidence fehlt für Art. 11?","Zeige Artefakte zu AML-Detector","Wie hängen Art. 9 und Art. 15 zusammen?"]},
      hierarchy: {default: ["Crosswalk zwischen EU AI Act und DORA","Welche Controls decken Art. 14 ab?","Evidence-Lücken im Sankey zeigen"]},
      itsm: {default: ["Root Cause von INC0012345?","Wie beeinflusst der Incident den GMS?","PIR-Status aller Incidents"]},
      gms: {default: ["Warum ist Audit Readiness gesunken?","GMS-Prognose bei voller Compliance","Welche Komponente hat den größten Einfluss?"]},
      registry: {default: ["Zeige alle Hochrisiko-Modelle","Status von KreditScore-LLM?","Welches Modell braucht Aufmerksamkeit?"]}
    };
    const screenMap = screenSuggestions[state.screen];
    if (screenMap) {
      const specific = screenMap[state.persona] || screenMap.default;
      if (specific) return specific;
    }
    const r = COPILOT_RESPONSES[state.persona];
    if (!r) return [];
    return [r.q, "Zeige Top-Risiken", "GMS-Trend erklären"];
  }, [state.persona, state.screen]);

  const sendMessage = useCallback((text) => {
    if (!text || typing) return;
    const userMsg = {id: Date.now(), type: "user", text};
    const newMsgs = [...state.copilotMessages, userMsg];
    set({copilotMessages: newMsgs});
    setInputVal("");
    setTyping(true);

    const resp = COPILOT_RESPONSES[state.persona];
    const answer = resp ? resp.a : "Ich analysiere Ihre Governance-Daten...\n\nBitte wählen Sie einen spezifischen Bereich.";

    let i = 0;
    setTypedText("");
    const interval = setInterval(() => {
      if (i < answer.length) {
        setTypedText(answer.slice(0, i + 1));
        i++;
      } else {
        clearInterval(interval);
        setTyping(false);
        const botMsg = {id: Date.now()+1, type: "bot", text: answer};
        set({copilotMessages: [...newMsgs, botMsg]});
        setTypedText("");
      }
    }, 15);
  }, [state.copilotMessages, state.persona, typing, set]);

  useEffect(() => { msgEndRef.current?.scrollIntoView({behavior:"smooth"}); }, [state.copilotMessages, typedText]);

  return (
    <div className={`copilot-overlay ${state.copilotOpen ? "open" : ""}`}>
      <div className="copilot-header">
        <span style={{fontSize:20}}>🤖</span>
        <span style={{fontWeight:600,flex:1,color:"var(--text1)",fontSize:14}}>AGP CoPilot</span>
        <button className="topbar-btn" onClick={() => set({copilotOpen:false})}>&times;</button>
      </div>
      <div className="copilot-suggestions">
        {suggestions.map((s,i) => (
          <button key={i} className="copilot-chip" onClick={() => sendMessage(s)}>{s}</button>
        ))}
      </div>
      <div className="copilot-messages">
        <div className="copilot-bubble bot">
          Willkommen! Ich bin der AGP CoPilot. Wie kann ich Ihnen bei der KI-Governance helfen?
          <div className="posthoc-hint" style={{marginTop:8,fontSize:10}}>🔒 Read-Only · PostHoc-konform · Alle Interaktionen werden protokolliert</div>
        </div>
        {state.copilotMessages.map(m => (
          <div key={m.id} className={`copilot-bubble ${m.type === "user" ? "user" : "bot"}`}
            dangerouslySetInnerHTML={{__html: m.text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br/>")}}/>
        ))}
        {typing && (
          <div className="copilot-bubble bot">
            <span dangerouslySetInnerHTML={{__html: typedText.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br/>")}}/>
            <span className="typing-cursor"/>
          </div>
        )}
        <div ref={msgEndRef}/>
      </div>
      <div className="copilot-input">
        <input value={inputVal} onChange={e => setInputVal(e.target.value)}
          onKeyDown={e => e.key === "Enter" && sendMessage(inputVal)}
          placeholder="Fragen Sie den AGP CoPilot..."/>
        <button onClick={() => sendMessage(inputVal)}>Senden</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════ */
/* GUIDED TOUR                                 */
/* ═══════════════════════════════════════════ */
function GuidedTour() {
  const {state, set} = useApp();
  if (!state.tourActive || !state.persona) return null;
  const steps = TOUR_STEPS[state.persona] || [];
  if (steps.length === 0 || state.tourStep >= steps.length) return null;
  const step = steps[state.tourStep];
  const next = () => {
    if (state.tourStep + 1 >= steps.length) set({tourActive: false});
    else set({tourStep: state.tourStep + 1});
  };
  return (
    <>
      <div className="tour-backdrop" onClick={() => set({tourActive:false})}/>
      <div className="tour-tooltip" style={{top:"50%",left:"50%",transform:"translate(-50%,-50%)"}}>
        <h4>{step.title}</h4>
        <p>{step.text}</p>
        <div className="tour-actions">
          <button className="tour-btn tour-btn-skip" onClick={() => set({tourActive:false})}>Überspringen</button>
          <div className="tour-dots">
            {steps.map((_,i) => <div key={i} className={`tour-dot ${i===state.tourStep?"active":""}`}/>)}
          </div>
          <button className="tour-btn tour-btn-next" onClick={next}>
            {state.tourStep + 1 >= steps.length ? "Fertig" : "Weiter"}
          </button>
        </div>
      </div>
    </>
  );
}

/* REGULATORY HIERARCHY (Sankey)               */
/* ═══════════════════════════════════════════ */
function RegulatoryHierarchy() {
  const svgRef = useRef();
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 50); return () => clearTimeout(t); }, []);
  useEffect(() => {
    if (!svgRef.current || !ready) return;
    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove();
    const width = svgRef.current.clientWidth || svgRef.current.parentElement?.clientWidth || 900;
    const height = 400;
    const margin = {top:10,right:10,bottom:10,left:10};

    const nodes = [
      // Level 0: Frameworks
      {name:"EU AI Act"},{name:"DORA"},{name:"BSI AIC4"},{name:"ISO 42001"},{name:"NIS2"},
      // Level 1: Chapters
      {name:"Titel III (Hochrisiko)"},{name:"Kap. II (IKT-Risiko)"},{name:"§4 (Anforderungen)"},{name:"§6 (Planung)"},{name:"Art. 21 (Maßnahmen)"},
      // Level 2: Articles
      {name:"Art. 9 (Risk Mgmt)"},{name:"Art. 11 (Doku)"},{name:"Art. 14 (Oversight)"},{name:"Art. 5 (IKT-Gov)"},{name:"AIC4-C1"},{name:"§6.1 (Risiken)"},{name:"NIS2-M1"},
      // Level 3: Controls
      {name:"Risikobewertung"},{name:"Tech. Dokumentation"},{name:"Human-Oversight-Plan"},{name:"IKT-Risiko-Policy"},{name:"Cloud-Security"},{name:"AI-Risk-Assessment"},{name:"Incident-Reporting"},
      // Level 4: Evidence
      {name:"risk_assess_v2.3.pdf"},{name:"model_card_v2.3.md"},{name:"oversight_protocol.pdf"},{name:"ikt_policy_2026.pdf"},{name:"aic4_cert.pdf"},{name:"iso42001_plan.pdf"},{name:"incident_log.json"}
    ];

    const links = [
      // Framework → Chapter
      {source:0,target:5,value:3},{source:1,target:6,value:1},{source:2,target:7,value:1},{source:3,target:8,value:1},{source:4,target:9,value:1},
      // Chapter → Article
      {source:5,target:10,value:1},{source:5,target:11,value:1},{source:5,target:12,value:1},{source:6,target:13,value:1},{source:7,target:14,value:1},{source:8,target:15,value:1},{source:9,target:16,value:1},
      // Article → Control
      {source:10,target:17,value:1},{source:11,target:18,value:1},{source:12,target:19,value:1},{source:13,target:20,value:1},{source:14,target:21,value:1},{source:15,target:22,value:1},{source:16,target:23,value:1},
      // Control → Evidence
      {source:17,target:24,value:1},{source:18,target:25,value:1},{source:19,target:26,value:1},{source:20,target:27,value:1},{source:21,target:28,value:1},{source:22,target:29,value:1},{source:23,target:30,value:1}
    ];

    const sankey = d3.sankey()
      .nodeId((d,i) => i)
      .nodeWidth(16)
      .nodePadding(10)
      .extent([[margin.left, margin.top],[width-margin.right, height-margin.bottom]]);

    const {nodes: sNodes, links: sLinks} = sankey({
      nodes: nodes.map((d,i) => ({...d, index:i})),
      links: links.map(d => ({...d}))
    });

    const colors = ["#2A6496","#3D8B6E","#E6A817","#6B7B8D","#50617D"];
    const getColor = (d) => {
      if (d.x0 < width*0.2) return colors[0];
      if (d.x0 < width*0.4) return colors[1];
      if (d.x0 < width*0.6) return colors[2];
      if (d.x0 < width*0.8) return colors[3];
      return colors[4];
    };

    // Links with animation
    const linkG = svg.append("g").selectAll("path").data(sLinks).join("path")
      .attr("d", d3.sankeyLinkHorizontal()).attr("class","sankey-link")
      .attr("stroke", d => getColor(d.source)).attr("stroke-width", d => Math.max(1, d.width))
      .attr("stroke-dasharray", function() { return this.getTotalLength(); })
      .attr("stroke-dashoffset", function() { return this.getTotalLength(); });
    linkG.transition().duration(1500).attr("stroke-dashoffset", 0);

    // Nodes
    const nodeG = svg.append("g").selectAll("g").data(sNodes).join("g").attr("class","sankey-node");
    nodeG.append("rect").attr("x",d=>d.x0).attr("y",d=>d.y0).attr("height",d=>d.y1-d.y0).attr("width",d=>d.x1-d.x0)
      .attr("fill",d=>getColor(d)).attr("rx",2);
    nodeG.append("text").attr("x",d=>d.x0<width/2?d.x1+6:d.x0-6).attr("y",d=>(d.y1+d.y0)/2)
      .attr("dy","0.35em").attr("text-anchor",d=>d.x0<width/2?"start":"end")
      .text(d=>d.name).attr("fill","var(--text2)").attr("font-size",10);

  }, [ready]);

  return (
    <div>
      <h2 style={{fontSize:18,marginBottom:4}}>Regulatory Hierarchy — 5-Ebenen-Ansicht</h2>
      <p style={{fontSize:13,color:"var(--text3)",marginBottom:16}}>Framework → Kapitel → Artikel → Control → Evidence</p>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div className="sankey-container">
          <svg ref={svgRef} style={{width:"100%",height:400}}/>
        </div>
      </div>
      <div style={{display:"flex",gap:12,marginTop:12,flexWrap:"wrap"}}>
        {[["Framework","#2A6496"],["Kapitel","#3D8B6E"],["Artikel","#E6A817"],["Control","#6B7B8D"],["Evidence","#50617D"]].map(([l,c]) => (
          <div key={l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text3)"}}>
            <div style={{width:12,height:12,borderRadius:2,background:c}}/> {l}
          </div>
        ))}
      </div>
      <div className="posthoc-hint">🔗 Crosswalk: Identische Anforderungen über Frameworks hinweg werden automatisch verknüpft</div>
    </div>
  );
}

    {source:"KreditScore-LLM",target:"training_data.json",type:"TRAINED_ON",label:"trainiert mit"},
    {source:"AML-Detector",target:"bias_threshold",type:"SUBJECT_TO",label:"unterliegt"},
    {source:"AML-Detector",target:"Gate Result",type:"ASSESSED_BY",label:"geprüft durch"},
    {source:"Compliance Check",target:"risk_assess.pdf",type:"PRODUCES",label:"erzeugt"},
    {source:"AML-Detector",target:"EU AI Act",type:"SUBJECT_TO",label:"unterliegt"},
  ];

  useEffect(() => {
    if (!svgRef.current || !ready) return;
    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove();
    const width = svgRef.current.clientWidth || svgRef.current.parentElement?.clientWidth || 700;
    const height = 520;

    const nodes = GRAPH_NODES.map(d => ({...d}));
    const links = GRAPH_LINKS.map(d => ({...d}));

    const colors = {model:"#2A6496",regulation:"#E6A817",policy:"#3D8B6E",evidence:"#9C27B0",assessment:"#8D99AE"};
    const radius = {model:18,regulation:14,policy:13,evidence:11,assessment:11};

    const defs = svg.append("defs");
    Object.entries(colors).forEach(([type, color]) => {
      defs.append("marker").attr("id","arrow-"+type).attr("viewBox","0 -5 10 10").attr("refX",25)
        .attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
        .append("path").attr("d","M0,-5L10,0L0,5").attr("fill",color).attr("opacity",.6);
    });

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d=>d.id).distance(100))
      .force("charge", d3.forceManyBody().strength(-350))
      .force("center", d3.forceCenter(width/2, height/2))
      .force("collision", d3.forceCollide().radius(30));

    const linkG = svg.append("g");
    const link = linkG.selectAll("line").data(links).join("line")
      .attr("stroke", d => colors[nodes.find(n=>n.id===(d.source.id||d.source))?.type] || "#555")
      .attr("stroke-width", 2).attr("stroke-opacity", .4)
      .attr("stroke-dasharray","6,4")
      .attr("marker-end", d => "url(#arrow-" + (nodes.find(n=>n.id===(d.target.id||d.target))?.type||"model") + ")")
      .classed("graph-link-animated", true);

    const linkLabel = svg.append("g").selectAll("text").data(links).join("text")
      .text(d => d.label).attr("font-size",9).attr("fill","var(--text3)").attr("text-anchor","middle").attr("opacity",.6);

    const nodeG = svg.append("g");
    const node = nodeG.selectAll("g").data(nodes).join("g").attr("class","graph-node").style("cursor","pointer")
      .call(d3.drag().on("start",(e,d)=>{if(!e.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
        .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}));

    node.append("circle").attr("r",d=>radius[d.type]+4).attr("fill","none").attr("stroke","none").attr("class","glow-ring");
    node.append("circle").attr("r",d=>radius[d.type]).attr("fill",d=>colors[d.type]).attr("stroke","rgba(255,255,255,.25)").attr("stroke-width",2);
    node.append("text").text(d=>d.id).attr("dx",d=>radius[d.type]+6).attr("dy",4).attr("fill","var(--text2)").attr("font-size",11).attr("font-weight",500);

    node.on("mouseover", function() {
      d3.select(this).select(".glow-ring").attr("stroke",d=>colors[d.type]).attr("stroke-width",2).attr("stroke-opacity",.5);
    }).on("mouseout", function() {
      d3.select(this).select(".glow-ring").attr("stroke","none");
    });

    node.on("click", (e, d) => {
      setSelectedNode(d);
      const connected = links.filter(l => (l.source.id||l.source)===d.id || (l.target.id||l.target)===d.id)
        .flatMap(l => [(l.source.id||l.source),(l.target.id||l.target)]);
      setConnectedIds([...new Set([d.id, ...connected])]);
      node.selectAll("circle").attr("stroke-opacity",.2);
      node.filter(n => [...new Set([d.id,...connected])].includes(n.id))
        .selectAll("circle").attr("stroke","#fff").attr("stroke-width",3).attr("stroke-opacity",1);
      link.attr("stroke-opacity", l => connected.includes(l.source.id||l.source) || connected.includes(l.target.id||l.target) ? .8 : .1);
    });

    simulation.on("tick", () => {
      link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      linkLabel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2 - 6);
      node.attr("transform",d=>`translate(${d.x},${d.y})`);
    });
    return () => simulation.stop();
  }, [ready]);

  const nodeDetail = selectedNode ? GRAPH_NODES.find(n => n.id === selectedNode.id) : null;
  const nodeLinks = selectedNode ? GRAPH_LINKS.filter(l => l.source === selectedNode.id || l.target === selectedNode.id ||
    (typeof l.source === "object" && l.source.id === selectedNode.id) || (typeof l.target === "object" && l.target.id === selectedNode.id)) : [];

  const useCases = [
    {icon:"🔍",title:"Traceability",desc:"Verfolgen Sie den Pfad von KI-Modell → Regulierung → Policy → Evidence lückenlos."},
    {icon:"💥",title:"Impact-Analyse",desc:"Klicken Sie auf einen Artikel: Welche Modelle und Policies sind betroffen?"},
    {icon:"✅",title:"Audit-Readiness",desc:"Prüfen Sie, ob alle Evidence-Dokumente für jeden Artikel vorhanden sind."},
    {icon:"⚠️",title:"Gap-Analyse",desc:"Finden Sie fehlende Verknüpfungen: Artikel ohne Evidence = Compliance-Lücke."},
    {icon:"🌐",title:"Cross-Regulation",desc:"Visualisieren Sie Überschneidungen zwischen EU AI Act, DSGVO und ISO 42001."},
  ];

  return (
    <div>
      <h2 style={{fontSize:18,marginBottom:8}}>Evidence Graph</h2>
      {showBanner && <div className="info-banner">
        <span className="banner-icon">💡</span>
        <div><strong>Was ist der Evidence Graph?</strong> Er visualisiert die vollständige Governance-Kette: Von KI-Modellen über regulatorische Anforderungen und Policies bis hin zu konkreten Evidence-Dokumenten. Klicken Sie auf einen Knoten, um alle Verbindungen hervorzuheben und Details im rechten Panel zu sehen. Ziehen Sie Knoten, um die Ansicht anzupassen.</div>
        <span className="banner-close" onClick={() => setShowBanner(false)}>✕</span>
      </div>}
      <div className="graph-container">
        <svg ref={svgRef} className="graph-svg"/>
        <div className="graph-detail" style={{minWidth:260}}>
          {nodeDetail ? (
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <div style={{width:14,height:14,borderRadius:"50%",background:{model:"#2A6496",regulation:"#E6A817",policy:"#3D8B6E",evidence:"#9C27B0",assessment:"#8D99AE"}[nodeDetail.type]}}/>
                <h3 style={{fontSize:14,color:"var(--text1)"}}>{nodeDetail.id}</h3>
              </div>
              <span className="badge badge-blue" style={{marginBottom:12,display:"inline-block"}}>{nodeDetail.type}</span>
              <p style={{fontSize:12,color:"var(--text2)",lineHeight:1.5,marginBottom:16}}>{nodeDetail.desc}</p>
              <div style={{fontSize:11,color:"var(--text3)",borderTop:"1px solid rgba(255,255,255,.06)",paddingTop:12}}>
                <p style={{fontWeight:700,marginBottom:8}}>Verbindungen ({nodeLinks.length}):</p>
                {nodeLinks.slice(0,6).map((l,i) => {
                  const src = typeof l.source === "object" ? l.source.id : l.source;
                  const tgt = typeof l.target === "object" ? l.target.id : l.target;
                  const other = src === selectedNode.id ? tgt : src;
                  return <div key={i} style={{padding:"4px 0",borderBottom:"1px solid rgba(255,255,255,.03)"}}><span style={{color:"var(--accent)"}}>{l.label}</span> → {other}</div>;
                })}
              </div>
            </div>
          ) : (
            <div style={{fontSize:12,color:"var(--text3)",textAlign:"center",paddingTop:40}}>
              <p style={{fontSize:32,marginBottom:12}}>🕸️</p>
              <p style={{fontWeight:600,marginBottom:8}}>Knoten anklicken</p>
              <p>Wählen Sie einen Knoten im Graph, um Details und alle Verbindungen anzuzeigen.</p>
            </div>
          )}
        </div>
      </div>
      <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
        {[["Modell","#2A6496"],["Regulatorik","#E6A817"],["Policy","#3D8B6E"],["Evidence","#9C27B0"],["Assessment","#8D99AE"]].map(([l,c]) => (
          <div key={l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text3)"}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:c}}/> {l}
          </div>
        ))}
        <span style={{fontSize:10,color:"var(--text3)",marginLeft:"auto"}}>→ = animierte Kante | Klick = Highlight-Netzwerk</span>
      </div>
      <div style={{marginTop:20}}>
        <h3 style={{fontSize:14,color:"var(--text1)",marginBottom:8}}>Was kann ich mit dem Evidence Graph tun?</h3>
        <div className="usecase-grid">
          {useCases.map((uc,i) => (
            <div key={i} className="usecase-card">
              <h4>{uc.icon} {uc.title}</h4>
              <p>{uc.desc}</p>
            </div>
          ))}
        </div>
      </div>
      <div className="posthoc-hint" style={{marginTop:16}}>🛡️ Der Evidence Graph visualisiert nachgelagert erhobene Governance-Daten — kein Eingriff in KI-Systeme (PostHoc-Prinzip).</div>
    </div>
  );
}

function MainContent() {
  const {state} = useApp();
  const screens = {
    dashboard: {
      executive: ExecDashboard,
      compliance: ComplianceDashboard,
      technical: TechDashboard,
      auditor: AuditDashboard,
    },
    gms: {default: GmsDetail},
    registry: {default: AIRegistry},
    evidence: {default: EvidenceGraph},
    report: {default: BoardReport},
    checker: {default: ComplianceChecker},
    hierarchy: {default: RegulatoryHierarchy},
    audit: {default: AuditTrail},
    itsm: {default: ItsmIncidents},
    policy: {default: PolicyExplorer},
    gates: {default: GateHistory},
    export: {default: AuditExport},
  };

  const screenDef = screens[state.screen];
  if (!screenDef) return <ExecDashboard/>;
  const Component = screenDef[state.persona] || screenDef.default || ExecDashboard;
  return <div className="content" key={state.screen}><Component/></div>;
}
